<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFVN.TGM - ADMIN THÔNG BÁO</title>
<style>
@font-face{font-family:GFF;src:url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2");font-weight:700}
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:GFF,Arial,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 0%,#ff7a0022,transparent 35%),radial-gradient(circle at 100% 100%,#ff450022,transparent 40%)}
.wrap{width:min(1050px,94%);margin:auto;padding:28px 0 60px}.brand{font-size:clamp(25px,6vw,45px);text-align:center;color:#ff7a00;text-shadow:0 0 20px #ff550055;margin:10px 0}.sub{text-align:center;color:#aaa;margin-bottom:25px}
.card{background:#111c;border:1px solid #ff790044;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 10px 40px #0008;backdrop-filter:blur(12px)}
h2{margin:0 0 16px;color:#ff8a00}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
label{display:block;color:#bbb;font-size:13px;margin-bottom:7px}input,textarea,select{width:100%;border:1px solid #333;background:#090909;color:#fff;border-radius:12px;padding:13px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:#ff7900}textarea{min-height:120px;resize:vertical}
button{border:0;border-radius:12px;padding:13px 17px;background:#ff7600;color:#111;font:inherit;cursor:pointer}button:hover{filter:brightness(1.1)}button.danger{background:#3a1510;color:#ff765c}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#888;font-size:13px}.hidden{display:none!important}
#login{max-width:460px;margin:70px auto}.msg{padding:12px;border-radius:10px;background:#20160d;color:#ffb066;margin:10px 0;display:none}.msg.show{display:block}
.item{border:1px solid #292929;border-radius:14px;padding:15px;margin:10px 0;background:#0b0b0b}.item h3{margin:0 0 7px}.item p{white-space:pre-wrap;color:#ccc;margin:7px 0}.meta{font-size:12px;color:#777}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#ff76001c;color:#ff9b4a;margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="card">
  <div class="brand">FFVN.TGM</div>
  <div class="sub">ADMIN GỬI THÔNG BÁO</div>
  <label>Mật khẩu Admin</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
  <div id="loginMsg" class="msg"></div>
  <button style="width:100%;margin-top:12px" onclick="login()">ĐĂNG NHẬP ADMIN</button>
</div>

<div id="app" class="hidden">
  <div class="brand">FFVN.TGM - ADMIN</div>
  <div class="sub">Gửi thông báo trực tiếp tới <b>ffvntgm-event-freefire.vercel.app</b></div>

  <div class="card">
    <h2>📢 Gửi thông báo</h2>
    <div class="grid">
      <div>
        <label>Tiêu đề</label>
        <input id="title" maxlength="120" placeholder="Ví dụ: Sự kiện mới đã cập nhật">
      </div>
      <div>
        <label>Loại thông báo</label>
        <select id="type"><option value="info">Thông báo</option><option value="event">Sự kiện</option><option value="update">Cập nhật</option><option value="urgent">Quan trọng</option></select>
      </div>
    </div>
    <div style="margin-top:14px">
      <label>Nội dung</label>
      <textarea id="message" maxlength="2000" placeholder="Nội dung muốn gửi tới người dùng..."></textarea>
    </div>
    <div class="grid" style="margin-top:14px">
      <div>
        <label>Link khi bấm thông báo (không bắt buộc)</label>
        <input id="link" type="url" placeholder="https://...">
      </div>
      <div>
        <label>Thời gian hiển thị (giờ, mặc định 24)</label>
        <input id="hours" type="number" min="1" max="720" value="24">
      </div>
    </div>
    <div id="sendMsg" class="msg"></div>
    <div class="row" style="margin-top:14px">
      <button onclick="sendNotification()">🚀 GỬI THÔNG BÁO</button>
      <button onclick="logout()">Đăng xuất</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">📋 Thông báo đã gửi</h2>
      <button onclick="loadNotifications()">↻ Làm mới</button>
    </div>
    <div id="list" class="muted" style="margin-top:12px">Đang tải...</div>
  </div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
function show(id,text){$(id).textContent=text;$(id).classList.add("show")}
async function login(){
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({password:$("password").value})});
    const d=await r.json(); if(!r.ok) throw Error(d.error||"Đăng nhập thất bại");
    $("login").classList.add("hidden");$("app").classList.remove("hidden");loadNotifications();
  }catch(e){show("loginMsg",e.message)}
}
async function logout(){await fetch("/api/logout",{method:"POST",credentials:"include"});location.reload()}
async function sendNotification(){
  const body={title:$("title").value.trim(),message:$("message").value.trim(),type:$("type").value,link:$("link").value.trim(),hours:Number($("hours").value)||24};
  if(!body.title||!body.message){show("sendMsg","Vui lòng nhập tiêu đề và nội dung.");return}
  try{
    const r=await fetch("/api/notifications",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify(body)});
    const d=await r.json();if(!r.ok)throw Error(d.error||"Không thể gửi");
    show("sendMsg","✅ Đã gửi thông báo tới User.");
    $("title").value="";$("message").value="";$("link").value="";loadNotifications();
  }catch(e){show("sendMsg",e.message)}
}
async function loadNotifications(){
  try{
    const r=await fetch("/api/notifications?admin=1",{credentials:"include"});const d=await r.json();
    if(!r.ok)throw Error(d.error||"Lỗi tải dữ liệu");
    $("list").innerHTML=d.notifications.length?d.notifications.map(n=>`
      <div class="item">
        <div><span class="tag">${escapeHtml(n.type||"info")}</span><span class="meta">${new Date(n.created_at).toLocaleString("vi-VN")}</span></div>
        <h3>${escapeHtml(n.title)}</h3><p>${escapeHtml(n.message)}</p>
        ${n.link?`<div class="meta">🔗 ${escapeHtml(n.link)}</div>`:""}
        <div class="row" style="margin-top:10px"><button class="danger" onclick="removeNotification('${n.id}')">Xóa</button></div>
      </div>`).join(""):"Chưa có thông báo.";
  }catch(e){$("list").textContent=e.message}
}
async function removeNotification(id){
  if(!confirm("Xóa thông báo này?"))return;
  const r=await fetch("/api/notifications?id="+encodeURIComponent(id),{method:"DELETE",credentials:"include"});
  if(r.ok)loadNotifications();else{const d=await r.json();alert(d.error||"Không thể xóa")}
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
(async()=>{try{const r=await fetch("/api/me",{credentials:"include"});if(r.ok){$("login").classList.add("hidden");$("app").classList.remove("hidden");loadNotifications()}}catch{}})();
</script>
</body>
</html>
